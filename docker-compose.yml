services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: giphy-hexagonal-api
    container_name: giphy_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      # APP_KEY is read from the bind-mounted .env; the entrypoint generates one
      # on first boot if it is empty. It is intentionally NOT injected here so an
      # empty value cannot override the generated key.
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-giphy}
      DB_USERNAME: ${DB_USERNAME:-giphy}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      GIPHY_API_KEY: ${GIPHY_API_KEY}
      GIPHY_BASE_URL: ${GIPHY_BASE_URL:-https://api.giphy.com/v1}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - giphy

  nginx:
    image: nginx:1.27-alpine
    container_name: giphy_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - giphy

  db:
    image: mariadb:11
    container_name: giphy_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-giphy}
      MARIADB_USER: ${DB_USERNAME:-giphy}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - giphy

volumes:
  dbdata:

networks:
  giphy:
    driver: bridge
