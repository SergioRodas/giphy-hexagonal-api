<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIPHY Hexagonal API — Playground</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --muted: #94a3b8; --text: #e2e8f0;
    --accent: #6366f1; --accent2: #22d3ee; --ok: #22c55e; --err: #ef4444; --line: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e293b, var(--bg)); color: var(--text);
    min-height: 100vh; padding: 24px;
  }
  header { max-width: 1080px; margin: 0 auto 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  .badge { margin-left: auto; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: #3f1d2b; color: #fca5a5; border: 1px solid #7f1d1d; }
  .badge.on { background: #052e1a; color: #86efac; border-color: #166534; }
  main { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; }
  .card .method { font-size: 12px; color: var(--accent2); font-family: ui-monospace, monospace; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: #0b1220; color: var(--text); font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), #8b5cf6); color: white; font-weight: 700; font-size: 14px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .full { grid-column: 1 / -1; }
  .console { background: #0b1220; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .console .status { font-family: ui-monospace, monospace; font-size: 13px; margin-bottom: 8px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); } .status.loading { color: var(--accent2); }
  .spinner { display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent2); border-radius: 50%;
    animation: spin .7s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button.loading { position: relative; color: transparent; }
  button.loading::after { content: ""; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace;
    font-size: 12.5px; color: #cbd5e1; max-height: 260px; overflow: auto; }
  .gifs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .gifs figure { margin: 0; width: 120px; }
  .gifs img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background:#0b1220; }
  .gifs figcaption { font-size: 10px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  a { color: var(--accent2); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>🐢 GIPHY Hexagonal API — Playground</h1>
    <div class="sub">Log in once, then try every service. Requests hit <code>/api/*</code> on this host.</div>
  </div>
  <div id="tokenBadge" class="badge">Not authenticated</div>
</header>

<main>
  <section class="card">
    <h2>1 · Login</h2>
    <div class="method">POST /api/login</div>
    <label>Email</label>
    <input id="email" value="demo@giphy-hexagonal.test">
    <label>Password</label>
    <input id="password" type="password" value="password">
    <button onclick="login(this)">Log in</button>
  </section>

  <section class="card">
    <h2>2 · Search GIFs</h2>
    <div class="method">GET /api/gifs/search</div>
    <label>Query (required)</label>
    <input id="q" value="cat">
    <div class="row">
      <div><label>Limit</label><input id="limit" value="6"></div>
      <div><label>Offset</label><input id="offset" value="0"></div>
    </div>
    <button onclick="search(this)">Search</button>
  </section>

  <section class="card">
    <h2>3 · Get GIF by ID</h2>
    <div class="method">GET /api/gifs/{id}</div>
    <label>GIF id (alphanumeric)</label>
    <input id="gifId" value="Ev477g37MJORyOWfdG">
    <button onclick="getById(this)">Fetch</button>
  </section>

  <section class="card">
    <h2>4 · Save Favorite</h2>
    <div class="method">POST /api/favorites</div>
    <label>GIF id</label>
    <input id="favGifId" value="Ev477g37MJORyOWfdG">
    <div class="row">
      <div><label>Alias</label><input id="alias" value="My favourite cat"></div>
      <div><label>User id (must match token)</label><input id="userId" value=""></div>
    </div>
    <button onclick="saveFavorite(this)">Save favorite</button>
  </section>

  <section class="console full">
    <div id="status" class="status">Response will appear here.</div>
    <div id="gifs" class="gifs"></div>
    <pre id="out"></pre>
  </section>
</main>

<script>
  let token = localStorage.getItem('gh_token') || '';
  let userId = localStorage.getItem('gh_user_id') || '';
  let expiresAt = localStorage.getItem('gh_expires_at') || '';
  const $ = (id) => document.getElementById(id);

  function sessionExpired() {
    return Boolean(token && expiresAt && Date.parse(expiresAt) <= Date.now());
  }

  function refreshBadge() {
    const b = $('tokenBadge');
    if (!token) {
      b.textContent = 'Not authenticated';
      b.classList.remove('on');
    } else if (sessionExpired()) {
      b.textContent = 'Session expired · log in again';
      b.classList.remove('on');
    } else {
      b.textContent = 'Authenticated · user #' + (userId || '?');
      b.classList.add('on');
    }
    if (userId && !$('userId').value) $('userId').value = userId;
  }

  function show(status, ok, body, gifs) {
    const s = $('status');
    s.textContent = 'HTTP ' + status;
    s.className = 'status ' + (ok ? 'ok' : 'err');
    $('out').textContent = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
    const g = $('gifs'); g.innerHTML = '';
    (gifs || []).forEach((gif) => {
      const url = gif.images?.preview?.url || gif.images?.original?.url;
      if (!url) return;
      const fig = document.createElement('figure');
      fig.innerHTML = '<img src="' + url + '" alt=""><figcaption>' + gif.id + '</figcaption>';
      g.appendChild(fig);
    });
  }

  async function call(method, path, body) {
    const headers = { 'Accept': 'application/json' };
    if (body) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    try {
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      const text = await res.text();
      let json; try { json = JSON.parse(text); } catch { json = text; }
      return { status: res.status, ok: res.ok, json };
    } catch (e) {
      return { status: 0, ok: false, json: 'Network error: ' + e.message };
    }
  }

  function decodeSub(jwt) {
    try {
      const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return payload.sub;
    } catch { return ''; }
  }

  // ---- Request lifecycle: lock the UI + show a loader while a call is in flight ----
  let busy = false;

  function setBusy(on, activeButton) {
    document.querySelectorAll('main button').forEach((b) => {
      b.disabled = on;
      b.classList.toggle('loading', on && b === activeButton);
    });
  }

  function showLoading() {
    const s = $('status');
    s.className = 'status loading';
    s.innerHTML = '<span class="spinner"></span>Sending request…';
    $('gifs').innerHTML = '';
    $('out').textContent = '';
  }

  // Runs an action while blocking every button and showing a loader. Repeated
  // clicks are ignored, and the loader stays visible for at least 300ms so fast
  // local responses are still perceptible.
  async function execute(button, action) {
    if (busy) return;
    busy = true;
    setBusy(true, button);
    showLoading();
    const startedAt = Date.now();
    let result;
    try {
      result = await action();
    } catch (e) {
      result = { status: 0, ok: false, body: 'Error: ' + e.message };
    }
    const elapsed = Date.now() - startedAt;
    if (elapsed < 300) await new Promise((r) => setTimeout(r, 300 - elapsed));
    setBusy(false, button);
    busy = false;
    if (result) {
      // A 401 on an authenticated call means the stored token is no longer
      // valid (expired or revoked): reflect it in the badge immediately.
      if (result.status === 401 && token) {
        expiresAt = new Date(0).toISOString();
        localStorage.setItem('gh_expires_at', expiresAt);
        refreshBadge();
      }
      show(result.status, result.ok, result.body, result.gifs);
    }
  }

  function login(button) {
    return execute(button, async () => {
      const r = await call('POST', '/api/login', { email: $('email').value, password: $('password').value });
      if (r.ok && r.json.access_token) {
        token = r.json.access_token;
        userId = decodeSub(token) || '';
        expiresAt = r.json.expires_at || '';
        localStorage.setItem('gh_token', token);
        localStorage.setItem('gh_user_id', userId);
        localStorage.setItem('gh_expires_at', expiresAt);
        $('userId').value = userId;
      }
      refreshBadge();
      return { status: r.status, ok: r.ok, body: r.json };
    });
  }

  function search(button) {
    return execute(button, async () => {
      const p = new URLSearchParams({ query: $('q').value, limit: $('limit').value, offset: $('offset').value });
      const r = await call('GET', '/api/gifs/search?' + p.toString());
      return { status: r.status, ok: r.ok, body: r.json, gifs: r.ok ? r.json.data : [] };
    });
  }

  function getById(button) {
    return execute(button, async () => {
      const r = await call('GET', '/api/gifs/' + encodeURIComponent($('gifId').value));
      return { status: r.status, ok: r.ok, body: r.json, gifs: r.ok ? [r.json.data] : [] };
    });
  }

  function saveFavorite(button) {
    return execute(button, async () => {
      const r = await call('POST', '/api/favorites', {
        gif_id: $('favGifId').value, alias: $('alias').value, user_id: Number($('userId').value),
      });
      return { status: r.status, ok: r.ok, body: r.json };
    });
  }

  refreshBadge();
  // Flip the badge to "Session expired" on its own once the token TTL passes.
  setInterval(refreshBadge, 30000);
</script>
</body>
</html>
